services:
  - type: web
    name: pulse-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Neon connection string, add ?sslmode=require
      - key: REDIS_URL
        sync: false # Upstash connection string — use the rediss:// (TLS) form, not redis://,
        # so ioredis enables TLS automatically. Without this, sessions live in-process
        # (InMemorySessionStore) and are wiped on every deploy/restart.
      - key: APP_BASE_URL
        sync: false # the frontend's own URL, e.g. https://pulse.example.workers.dev — magic
        # links point here (not at this Render URL) so /auth/callback is proxied through
        # the frontend's Worker (see frontend/src/worker.ts), keeping the session cookie
        # first-party instead of third-party and subject to browser blocking.
      - key: CORS_ORIGIN
        sync: false # the frontend's Cloudflare Workers URL, e.g. https://pulse.example.workers.dev
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # e.g. "Pulse <pulse@yourdomain.com>", must be a Resend-verified domain
      - key: INTERNAL_TASK_SECRET
        sync: false # random string, also configured in cron-job.org's request header
      - key: ALLOWED_DOMAINS
        sync: false # optional: comma-separated list of email domains allowed to sign in
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false # this email is auto-promoted to global admin on its first login
